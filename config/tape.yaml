# Every threshold the tape uses. These are starting values (design doc,
# "Thresholds are starting values and get tuned in the first two weeks"). The
# metrics job publishes the values it ran with to the `definitions` table, and
# the site's method page renders them from there, so changing a number here
# changes the method page on the next hourly run. Record the change in
# site/lib/changelog.ts as well.

handle: "@zetsurui"
timezone: America/New_York

cohorts:
  whale_count: 50          # top N addresses by gross notional across the complex, recomputed daily
  mid_floor_usd: 25000     # gross notional at or above this is mid; below is small
  fresh_days: 30           # first fill in the complex under this many days ago
  bot_fills_per_day: 200   # bots: more fills than this per day ...
  bot_median_hold_s: 600   # ... and a median hold under this many seconds
  bot_lookback_days: 7
  bot_min_observed_days: 1  # no bot classification until the tape has watched fills this long
  crowding_top_n: 5
  # The whale set for an ET day is computed on the first metrics run whose
  # snapshot hour is at or after this ET hour, and used until the next one.
  recompute_hour_et: 15

coverage:
  post_min: 0.98           # a chart without this much coverage is not posted
  # Below this the market's line is drawn dashed and its coverage printed.
  dashed_below: 0.98

daily:
  # The daily post renders at 16:00 ET from the last complete sweep, which is
  # the 15:00 ET snapshot (a sweep takes ~10 minutes). Daily series rows are
  # written from this hour.
  snapshot_hour_et: 15
  window_days: 30

events:
  whale_flip_min_usd: 250000     # notional on the new side
  whale_entry_min_usd: 500000    # non-whale opening this much on one market
  whale_net_move: 0.05           # 24h change in whale net, share of OI
  funding_hourly: 0.0005         # 0.05% per hour, either direction
  premium_bps: 50
  liquidation_share: 0.03        # of OI, in one hour
  # Alerts are held for this many hours after the first sweep so the bootstrap
  # (every position looks new) does not page the operator.
  warmup_hours: 24

indexer:
  info_weight_per_minute: 1200   # Hyperliquid's published per-IP limit
  budget_fraction: 0.85          # leave headroom for anything else on the box
  low_priority_reserve: 0.30     # history/seed work only runs above this fraction of the bucket
  inactive_days: 14              # no position and no fill for this long: drop from the sweep set
  backfill_gap_s: 60             # WebSocket gaps longer than this are backfilled from userFillsByTime
  sweep_offset_s: 20             # start each hourly sweep this long after the hour
  liq_px_band: 0.01              # a reducing fill within 1% of the snapshot liquidation price is a liquidation candidate
  universe_refresh_s: 21600

vercel:
  # Shifts start every 10 minutes (vercel.json) and last longer than that, so
  # one always holds the WebSocket. Background loops stop overlap_s early.
  shift_s: 690
  shift_overlap_s: 90
  # The sweep function gets this share of the info budget; a shift running
  # alongside it drops to the rest.
  sweep_budget_share: 0.75
  # A sweep invocation stops sweeping this many seconds after it starts, to
  # leave time for metrics and charts inside maxDuration (800 s).
  sweep_stop_s: 540
  metrics_min_s: 200   # run metrics in the same invocation only with this much time left

render:
  width_px: 1200
  height_px: 675
  hourly_retention_days: 30      # db chart store only; s3 keeps everything

# ---- AI Leverage Map (design doc, Nov 5 2026) ------------------------------

depth:
  # l2Book aggregations, finest first: full precision reaches a fraction of a
  # percent on most HIP-3 books, so the coarser views carry the bands out to 10%.
  sig_figs: [full, 3, 2]
  sample_s: 60

graph:
  stale_days: 90                 # an edge not re-checked for this long is flagged stale

stress:
  # Monthly since the Stack Engine revision (Nov 5 2026): the stress test is
  # the "fragility of the market's view" exhibit, not the weekly flagship.
  # It runs on the first such weekday of each month.
  cadence: monthly               # monthly | weekly
  weekday_et: 6                  # Sunday (Monday is 0)
  sweep_hour_et: 15              # positions from this sweep; the job runs after it, before Asia opens
  shocks: [-0.10, -0.20, -0.30]
  headline_shock: -0.20          # the scenario the card and the Telegram summary lead with
  node_kinds: [lab, neocloud, memory]
  graph_shock_kinds: [lab]       # "a lab and everything that depends on it"
  max_rounds: 10
  # Depth varies by hour, so every scenario runs on three books: the stored
  # one scaled to this hour's thick, median and thin 5% depth over the window.
  depth_window_days: 28
  depth_quantiles: [0.9, 0.5, 0.1]
  beta_days: 90                  # co-movement window for graph shocks (sell-off days only)
  min_beta_days: 15
  validation:
    tolerance: 0.5               # predicted forced selling within 50% of recorded liquidations
    min_move: 0.08               # an episode: a market falls this far ...
    window_h: 24                 # ... within this many hours of a sweep
    min_recorded_usd: 250000     # episodes with less recorded than this say nothing
    min_episodes: 3
    pass_share: 0.75             # of the recent qualifying episodes, this share must land within tolerance
    lookback_days: 180

loop:
  # Baskets for the one-asset regime, as legs. Labs are the anchor: does the
  # market still tell a lab apart from its landlords and suppliers?
  anchor: labs
  baskets:
    labs: [labs]
    neoclouds: [neoclouds]
    chips: [silicon]
    memory: [memory_names, memory_price]
  corr_days: 30
  selloff_days: 90               # sell-off co-movement: days the anchor basket fell, over this window
  min_days: 15
  extreme_pctile: 0.95           # alert when a series is at or above this percentile of its own history
  min_history_days: 60
  tension_days: 90
  deal_days: 5

# ---- Stack Engine (design doc, Nov 5 2026, revised) -------------------------

stack:
  stale_days: 90                 # a config figure not re-checked for this long is flagged stale
  gap_persist_days: 5            # a gap is flagged after this many consecutive days without overlap
  edgar:
    since: 2023-01-01            # periods ending before this are not loaded
    pause_s: 0.2                 # between companies (SEC allows 10 requests a second)
    # metric -> concepts tried in order (the first that reports a period wins it)
    metrics:
      revenue: {type: duration, unit: usd, concepts: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax, RevenueFromContractWithCustomerIncludingAssessedTax]}
      capex: {type: duration, unit: usd, concepts: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets]}
      cash: {type: instant, unit: usd, concepts: [CashAndCashEquivalentsAtCarryingValue]}
      debt: {type: instant, unit: usd, concepts: [LongTermDebt, DebtInstrumentCarryingAmount]}
      operating_leases: {type: instant, unit: usd, concepts: [OperatingLeaseLiability]}
      finance_leases: {type: instant, unit: usd, concepts: [FinanceLeaseLiability]}
      backlog: {type: instant, unit: usd, concepts: [RevenueRemainingPerformanceObligation]}
      purchase_obligations: {type: instant, unit: usd, concepts: [UnrecordedUnconditionalPurchaseObligationBalanceSheetAmount, PurchaseObligation]}
      # A weighted average is not additive, so no quarter is derived from year-to-date figures.
      shares_diluted: {type: duration, unit: shares, xbrl_unit: shares, additive: false, concepts: [WeightedAverageNumberOfDilutedSharesOutstanding]}
  korea:
    hs: ["8542"]                 # integrated circuits; 854232 is memories
  sfcompute:
    source_url: https://docs.sfcompute.com/preview/orderbook.md
    accelerators: [h100, h200, b200]
    gpus_per_node: 8             # the book prices nodes of 8 GPUs
    horizon_days: 90             # windows collected: delivery starting within this
    rent_start_within_days: 14   # traded rent: windows starting within two weeks (the spot end)
    min_window_hours: 24
    rent_window_days: 7          # traded rent: median of the last week's quotes
