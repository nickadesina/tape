# The financing graph: who invests in, buys from and lends to whom across the
# AI build-out, with a source on every edge (AI Leverage Map design doc).
#
# Nodes are companies and funds. `markets` lists the Hyperliquid markets that
# price a node; a node without one stays in the graph as a counterparty. Every
# market in config/universe.yaml belongs to exactly one node, so the stress
# test can shock a name rather than a ticker.
#
# Edges: direction follows the money (`from` pays, invests, lends or buys).
#   type        equity | compute_contract | supply | debt_lease | revenue_concentration | guarantee
#   size_usd    as disclosed, or null
#   status      announced (LOI, MoU, "up to") | contracted (signed, filed)
#   tenor       as disclosed, free text
#   share       revenue_concentration only: the share of `to`'s revenue from `from`
#   date        when it was disclosed
#   source      a filing, a company announcement or reporting, linked
#   confidence  filed | company | reported
#   verified_at the last time a person checked the edge against its source.
#               An edge without it is a draft: it is not loaded, nothing reads
#               it, and `tape graph` lists it. Edges older than
#               graph.stale_days (config/tape.yaml) are flagged stale.
#
# Corrections to a published edge get a line under `corrections`; the map page
# shows them.

nodes:
  # Labs
  anthropic: {name: Anthropic, kind: lab, public: false, markets: [xyz:ANT, io:ANTH]}
  openai: {name: OpenAI, kind: lab, public: false, markets: [io:OAI]}
  spacex: {name: SpaceX (xAI), kind: lab, public: false, markets: [xyz:SPCX], note: "SpaceX holds xAI"}
  minimax: {name: MiniMax, kind: lab, public: true, markets: [xyz:MINIMAX]}
  zhipu: {name: Zhipu AI, kind: lab, public: true, markets: [xyz:ZHIPU]}
  # Neoclouds
  coreweave: {name: CoreWeave, kind: neocloud, public: true, markets: [xyz:CRWV]}
  nebius: {name: Nebius, kind: neocloud, public: true, markets: [xyz:NBIS, io:NBIS]}
  iren: {name: IREN, kind: neocloud, public: true, markets: [xyz:IREN]}
  # Chips
  nvidia: {name: Nvidia, kind: chip, public: true, markets: [xyz:NVDA, io:NVDA]}
  amd: {name: AMD, kind: chip, public: true, markets: [xyz:AMD]}
  intel: {name: Intel, kind: chip, public: true, markets: [xyz:INTC]}
  tsmc: {name: TSMC, kind: chip, public: true, markets: [xyz:TSM]}
  broadcom: {name: Broadcom, kind: chip, public: true, markets: [xyz:AVGO]}
  marvell: {name: Marvell, kind: chip, public: true, markets: [xyz:MRVL]}
  # Optics
  lumentum: {name: Lumentum, kind: optics, public: true, markets: [xyz:LITE]}
  aaoi: {name: Applied Optoelectronics, kind: optics, public: true, markets: [xyz:AAOI]}
  # Memory
  micron: {name: Micron, kind: memory, public: true, markets: [xyz:MU]}
  sk_hynix: {name: SK Hynix, kind: memory, public: true, markets: [xyz:SKHX, xyz:SKHY]}
  samsung: {name: Samsung Electronics, kind: memory, public: true, markets: [xyz:SMSN]}
  sandisk: {name: SanDisk, kind: memory, public: true, markets: [xyz:SNDK, io:SNDK]}
  cxmt: {name: CXMT, kind: memory, public: true, markets: [xyz:CXMT]}
  kioxia: {name: Kioxia, kind: memory, public: true, markets: [xyz:KIOXIA]}
  western_digital: {name: Western Digital, kind: memory, public: true, markets: [xyz:WDC]}
  # Baskets that trade on Hyperliquid. They are not companies, so no edge
  # points at them; they are here so every market has a node.
  memory_etf: {name: Roundhill Memory ETF, kind: fund, public: true, markets: [xyz:DRAM, io:DRAM]}
  lyte_etf: {name: LYTE ETF, kind: fund, public: true, markets: [xyz:LYTE]}
  ncld_etf: {name: NCLD ETF, kind: fund, public: true, markets: [xyz:NCLD]}
  # Hyperscalers: counterparties, not priced on the tape
  microsoft: {name: Microsoft, kind: hyperscaler, public: true}
  google: {name: Alphabet (Google), kind: hyperscaler, public: true}
  amazon: {name: Amazon, kind: hyperscaler, public: true}
  meta: {name: Meta, kind: hyperscaler, public: true}
  oracle: {name: Oracle, kind: hyperscaler, public: true}
  # Lenders, investors and other counterparties the draft edges need
  blackstone: {name: Blackstone, kind: lender, public: true}
  magnetar: {name: Magnetar Capital, kind: lender, public: false}
  morgan_stanley: {name: Morgan Stanley, kind: lender, public: true}
  mufg: {name: Mitsubishi UFJ Financial Group, kind: lender, public: true}
  jpmorgan: {name: JPMorgan Chase, kind: lender, public: true}
  softbank: {name: SoftBank Group, kind: fund, public: true}
  cerebras: {name: Cerebras Systems, kind: chip, public: false}

# Draft edges, 2026-11-05. An agent drafted these from filings, company
# releases and reporting, with the source it checked on each. Every one has
# verified_at: null, so none is loaded until a person checks it against its
# source and sets verified_at. `tape graph --drafts` lists them.
# Conventions the drafting used:
#   - `date` is the disclosure date of the cited source; when that is a later
#     filing, the note says when the agreement was signed.
#   - Debt and lease edges run lender (or lessor) -> borrower (or lessee).
#   - Warrant edges run holder -> issuer. Flip them if the money direction
#     should win (oai-amd-2025-10-b, meta-amd-2026-02-b, amzn-aaoi-2025-03).
#   - Amounts are written 100.0e+9: YAML reads 100.0e9 as a string.
#   - Some pairs overlap and must not be summed: Microsoft-Anthropic ($30B in
#     2025, amended to $44.9B), and the Amazon/Google 2026 facilities, part of
#     which went into Anthropic's Series H.
edges:
  # ---------------- NVIDIA <-> OpenAI ----------------
  - id: nvda-oai-2025-09
    from: nvidia
    to: openai
    type: equity
    size_usd: 100.0e+9
    status: announced
    tenor: "progressive, as each GW deployed; first GW 2H 2026 (Vera Rubin)"
    share: null
    date: 2025-09-22
    source: https://investor.nvidia.com/news/press-release-details/2025/OpenAI-and-NVIDIA-Announce-Strategic-Partnership-to-Deploy-10-Gigawatts-of-NVIDIA-Systems/default.aspx
    confidence: company
    note: "Letter of intent: NVIDIA intends to invest up to $100B progressively as each GW of at least 10 GW of NVIDIA systems is deployed. NVIDIA's FY2026 10-K (filed 2026-02-25) still said it was 'finalizing an investment and partnership agreement with OpenAI' with 'no assurance'. Press reports say the Feb 2026 $30B investment (nvda-oai-2026-02) replaced this LOI. That is not confirmed by a primary source; treat this edge as likely superseded."
    verified_at: null

  - id: nvda-oai-2026-02
    from: nvidia
    to: openai
    type: equity
    size_usd: 30.0e+9
    status: announced
    tenor: null
    share: null
    date: 2026-02-27
    source: https://www.cnbc.com/2026/02/27/open-ai-funding-round-amazon.html
    confidence: reported
    note: "NVIDIA $30B in OpenAI's $110B round at a $730B pre-money valuation, per OpenAI as reported by CNBC. CNBC also says OpenAI will use 3 GW of dedicated inference and 2 GW of training capacity on Vera Rubin systems. OpenAI's own page returned 403. Funding or closing of NVIDIA's portion is not confirmed in NVIDIA filings, which do not name the investee."
    verified_at: null

  - id: nvda-oai-2026-08
    from: nvidia
    to: openai
    type: guarantee
    size_usd: 105.0e+9
    status: contracted
    tenor: "each phase's 20-year lease term; ends early if OpenAI reaches a satisfactory credit rating"
    share: null
    date: 2026-08-26
    source: https://www.sec.gov/Archives/edgar/data/1045810/000104581026000075/nvda-20260726.htm
    confidence: filed
    note: "NVIDIA 10-Q (Q2 FY27): in Aug 2026 NVIDIA entered guarantees capped at $105B in total. They give credit support on the land, power and shell buildout with affiliates of SB Energy, on behalf of an OpenAI affiliate, for leases of about 4.25 GW of IT load at the PORTS campus in Pike County, Ohio. In exchange the site exclusively hosts NVIDIA infrastructure. NVIDIA also holds an option to support about 3.8 GW more. The beneficiary is the lessor (SB Energy), on OpenAI's behalf."
    verified_at: null

